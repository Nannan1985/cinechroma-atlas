<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>OSS 连接验证</title><style>body{background:#101724;color:#ddd;font:16px/1.8 system-ui;padding:24px}img,canvas{width:128px;height:128px;margin:8px}pre{white-space:pre-wrap}</style><h1>OSS 匿名读取与跨域验证</h1><p>本地测试页，仅请求两个自制测试对象；所有请求不携带登录凭据。</p><img id="plain" alt="普通图片加载"><canvas id="canvas" width="128" height="128"></canvas><pre id="result"></pre><script>
const base='https://cinechroma.oss-cn-hongkong.aliyuncs.com/atlas/probes/connectivity-v1/';const result=document.querySelector('#result');function log(s){result.textContent+=s+'\n'}
const plain=document.querySelector('#plain');plain.onload=()=>{log('普通 img：成功 '+plain.naturalWidth+'×'+plain.naturalHeight);const c=document.createElement('canvas');c.width=c.height=128;const ctx=c.getContext('2d');ctx.drawImage(plain,0,0);try{ctx.getImageData(0,0,1,1);log('普通图片 Canvas 像素读取：成功')}catch(e){log('普通图片 Canvas 像素读取：失败 '+e.name)}};plain.onerror=()=>log('普通 img：失败');plain.src=base+'probe.png';
fetch(base+'probe.json',{credentials:'omit',cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>log('fetch JSON：成功 '+JSON.stringify(d))).catch(e=>log('fetch JSON：失败 '+e.message));
const img=new Image();img.crossOrigin='anonymous';img.onload=()=>{const c=document.querySelector('#canvas'),ctx=c.getContext('2d');ctx.drawImage(img,0,0);try{const pixel=ctx.getImageData(32,32,1,1).data;const url=c.toDataURL('image/png');log('CORS img、Canvas读取及导出：成功 pixel='+Array.from(pixel)+' PNG='+url.startsWith('data:image/png'))}catch(e){log('CORS Canvas：失败 '+e.name)}};img.onerror=()=>log('CORS img：失败（查看控制台跨域错误）');img.src=base+'probe.png';
</script></html>
